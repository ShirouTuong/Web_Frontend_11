<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Người Dùng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        
                        <h2 class="text-center text-primary mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>

                        <form action="#" method="POST">
                            
                            <!-- 1. Họ và tên (Input) -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label font-weight-bold">Họ và tên</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- 2. Email (Input) -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" placeholder="example@domain.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn với bất kỳ ai khác.</div>
                            </div>

                            <!-- 3. Mật khẩu (Input password) -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu (Input password) -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio button) -->
                            <div class="mb-3">
                                <label class="form-label d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --Dưới đây là mã HTML hoàn chỉnh cho bài tập **"Thiết kế Trang Đăng Ký với Bootstrap Forms"**, đáp ứng đầy đủ các yêu cầu chi tiết:

1. **Họ và tên**, **Email**, **Mật khẩu**, **Xác nhận mật khẩu** (sử dụng `form-control`).
2. **Giới tính** (Radio button).
3. **Sở thích** (Checkbox).
4. **Quốc gia** (Dropdown Select với `form-select`).
5. **Nút Submit** (sử dụng `btn btn-primary`).
6. Định dạng chữ trực quan (`text-center`, `text-muted`) và hỗ trợ giao diện responsive.

```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <h2 class="text-center fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>

                        <form action="#" method="POST">
                            
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-medium">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không bao giờ chia sẻ email của bạn với bất kỳ ai khác.</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Tối thiểu 8 ký tự" required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-medium">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="country" class="form-label fw-medium">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="SGP">Singapore</option>
                                </select>
                            </div>

                            <!-- Nút Submit -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Đăng Ký</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js)"></script>
</body>
</html>
